# Local PostgreSQL. docs/schema.sql runs automatically the first time the volume is created.
# Port 5433 on the host so it does not clash with other projects' PostgreSQL on 5432.
services:
  db:
    image: postgres:16
    container_name: live-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - live-db-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  live-db-data:
